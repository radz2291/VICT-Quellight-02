# Candidate foundation deployment only. No service has been provisioned by this file.
# Use the app repository root as the service root; select this Blueprint path.
# Account billing/overage settings must also satisfy Radzi's FREE ONLY constraint.
services:
  - type: web
    name: quellight-foundation
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run check && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: QUELLIGHT_MODE
        value: foundation
      - key: QUELLIGHT_DEPLOYMENT
        value: hosted
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
# The startup preflight obtains the exact HTTPS origin from ORIGIN or the
# trusted Render-provided RENDER_EXTERNAL_URL. No application secrets here.
# /healthz proves the process is alive. /readyz must remain 503 until the
# actual hosted VICT runtime, owner authentication and provider are qualified.
